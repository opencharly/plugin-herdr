version: 2026.240.1943
# Makes this plugin repo a PROJECT so its own candy is actually gated: without a root
# charly.yml the repo is "project-less", `charly box validate` exits 0 on ANY manifest,
# and the stock candy CI step asserts nothing (opencharly/charly#459). The plugin candy +
# the herdr skill entity are declared below; the bed lives in opencharly/pod-herdr.
plugin-herdr:
    candy:
        version: 2026.245.1000
        description: |-
            The ‘charly herdr’ CLI for a Herdr terminal-multiplexer session (herdr.dev)
            PLUS the declarative `herdr:` check verb — a command:herdr +
            verb:herdr plugin (compiled into charly via compiled_plugins, and
            serving out-of-process from this repo before that wiring lands). ‘charly herdr status’ pings the target and summarizes
            workspaces/tabs/panes/agents; workspace/tab/pane helpers list, create, split,
            run commands, read output, and wait for matching output; agent helpers list,
            get, wait, prompt, and report lifecycle state. The `herdr:` check verb is the
            declarative venue-probe counterpart: authored as a `check:` step
            (`herdr: ping`, `workspace-list`, `pane-wait-output`, …), it resolves the
            in-venue herdr socket-bridge port to a host-routable address over the reverse
            channel and probes with the SAME NDJSON socket client the command uses (R3 —
            one protocol surface covers the CLI and every bed). No upstream herdr binary is
            needed: the plugin speaks the herdr socket API directly (newline-delimited JSON
            over the session socket; `herdr api schema --json` is the contract). Session
            targeting honors the herdr agent-skill safety boundary: the focused session is
            off-limits from outside unless HERDR_ENV=1, --focused, or an explicit
            --session/--endpoint target is given.
        plugin:
            providers:
                - command:herdr
                - verb:herdr
            source: github.com/opencharly/plugin-herdr/candy/plugin-herdr
        plan:
            - # ADE check: a deterministic build-context check that does NOT depend on a live
              # herdr venue the CLI needs. Mirrors plugin-agentteams / plugin-example-command —
              # a build-context `command` check running `true`. The full CLI end-to-end
              # (`charly herdr status` / `pane run` / `pane wait-output` against a live
              # session) is exercised by the Go e2e (fake-socket wire tests + TestLiveReadOnly)
              # and the live R10 bed roster (the check-herdr-pod host steps).
              check: the command:herdr + verb:herdr plugin ships a buildable Go module the host compiles into charly and the herdr command tree dispatches; the live herdr surface is exercised by the Go tests + the check-herdr-pod bed
              id: herdr-module-present
              context:
                - build
              command: "true"
herdr-skill:
    skill:
        name: herdr
        family: automation
        owner: plugin-herdr
        description: |-
            The compiled-in ‘charly herdr’ CLI + the `herdr:` check verb for a Herdr
            terminal-multiplexer session (herdr.dev). MUST be invoked before inspecting or
            controlling herdr workspaces, tabs, panes, or agents through charly, or before
            authoring/verifying the herdr candy and check-herdr-pod bed.
        triggers:
            - "‘charly herdr’ session control (status / workspace / tab / pane / agent helpers) / the `verb:herdr` check verb (`ping`, `workspace-list`, `pane-wait-output`, `agent-wait`, …) / the check-herdr-pod bed / the pod-herdr box"
        content: |-
            # herdr

            The compiled-in ‘charly herdr’ CLI + the declarative `herdr:` check verb for a
            Herdr terminal-multiplexer session — a `command:herdr` + `verb:herdr` plugin. The
            plugin speaks the herdr NDJSON socket API directly: no upstream ‘herdr’ binary, no
            SDK (the wire contract is `herdr api schema --json`, protocol 20).

            ## Session targeting (safety boundary, as code)

            The focused Herdr session is OFF-LIMITS from outside. The plugin targets:

            - `--session <name>` — a named test session (`~/.config/herdr/sessions/<name>/herdr.sock`),
              the sanctioned isolated server for experiments.
            - `--endpoint <host:port>` — a TCP endpoint speaking the herdr NDJSON protocol (the
              pod-herdr socket bridge on port 8095, host-resolved for verbs).
            - `HERDR_SOCKET_PATH` — an explicit socket path.
            - `HERDR_ENV=1` — you are INSIDE herdr (a herdr pane); the current session is yours.
            - `--focused` — explicit operator intent to touch the focused session.

            With no target outside herdr, `charly herdr` errors with guidance — never silently
            inspects or mutates the focused session. Parse pane/workspace/tab IDs from command
            output; prefer non-disruptive operations; never `server.stop` an active session.

            ## Command tree

            - `charly herdr status` — ping + workspace/tab/pane/agent counts + focused ids.
            - `charly herdr session snapshot` — the live session snapshot (JSON).
            - `charly herdr workspace list|create [--label] [--cwd] [--focus]`.
            - `charly herdr tab list [--workspace] | create [--workspace] [--label] [--focus]`.
            - `charly herdr pane list [--workspace] | split [--direction right|down] [--pane] [--cwd] [--focus]`.
            - `charly herdr pane run <pane> <command...>` — send text + Enter.
            - `charly herdr pane read <pane> [--source visible|recent|recent-unwrapped|detection] [--lines N]`.
            - `charly herdr pane wait-output <pane> --match <text>|--regex <pattern> [--source] [--timeout-ms]`.
            - `charly herdr pane send-text | send-keys` — raw literal/keys input.
            - `charly herdr agent list | get <target>`.
            - `charly herdr agent wait <target> [--until idle|working|blocked|done|unknown] [--timeout-ms]`.
            - `charly herdr agent prompt <target> <text> [--wait] [--timeout-ms]`.
            - `charly herdr agent report <pane> <agent> --state <state> [--message]` — wraps
              `pane.report_agent` (a custom agent reporting its own lifecycle, like the bed’s
              fake agent).
            - `charly herdr config` — the resolved target + how it was chosen.

            ## The `herdr:` check verb

            Declarative venue-probe counterpart of the CLI, authored as a `check:` step in a
            candy/box plan. It resolves the in-venue herdr socket bridge (port 8095) to a
            host-routable address over the reverse channel and probes with the SAME client
            the CLI uses (R3). Methods:

            - `herdr: ping` — the server answers.
            - `herdr: session-snapshot` — workspace/tab/pane/agent summary.
            - `herdr: workspace-list`, `herdr: tab-list [workspace: w1]`, `herdr: pane-list [workspace: w1]`.
            - `herdr: agent-list`.
            - `herdr: pane-wait-output [pane: w1:p1] [match: text|regex: pattern] [source] [timeout]`.
            - `herdr: agent-wait [agent: name] [until: idle|working|blocked|done|unknown] [timeout]`.
            - `herdr: agent-prompt [agent: name] [text: ...] [timeout]`.

            The verb skips under `charly check box` (no live venue on a disposable
            `podman run --rm`).

            ## Cross-References

            - `/charly-pod:herdr` — the herdr stack box + check-herdr-pod bed (pod-herdr repo).
            - `/charly-internals:plugin` — compiled-in command plugins, the provider model.
            - The herdr agent skill (herdrdev/herdr v0.8.2 `skills/herdr/SKILL.md`) — the upstream
              agent contract this plugin operationalizes.
